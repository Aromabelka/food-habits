function activeQuestions(answers, survey = SURVEY) {
  return survey.questions.filter(q => q.id !== 'Q1A' || answers.Q1 === 'NO_BREAKFAST');
}
function validateAnswers(answers, survey = SURVEY) {
  if (!answers || typeof answers !== 'object' || Array.isArray(answers)) throw new Error('Ответьте на все вопросы.');
  const questions = activeQuestions(answers, survey);
  const allowed = new Set(questions.map(q => q.id));
  for (const key of Object.keys(answers)) {
    if (!allowed.has(key) && !(key === 'Q1A' && answers[key] === null)) throw new Error('Недопустимый ответ в скрытом вопросе.');
  }
  const normalized = {};
  questions.forEach(q => {
    if (!q.options.some(o => o.id === answers[q.id])) throw new Error('Проверьте ответы на все вопросы.');
    normalized[q.id] = answers[q.id];
  });
  if (!allowed.has('Q1A')) normalized.Q1A = null;
  return normalized;
}
function evaluate(answers, survey = SURVEY) {
  const a = validateAnswers(answers, survey);
  const score = id => survey.questions.find(q => q.id === id).options.find(o => o.id === a[id]).score;

  const P = score(first ? 'Q1A' : 'Q1');
  const plants = ['Q4','Q2','Q3'].map(id => ({id, score:score(id)})).filter(x => x.score !== null);
  const V = plants.length ? Math.max(...plants.map(x => x.score)) : null;
  const amount = score('Q5');
  const W = amount === null ? null : amount === 0 ? 0 : amount === 2 && (score('Q6') === 2 || score('Q7') === 2) ? 2 : 1;
  const scores = {P,V,W};
  const candidates = ['P','V','W'].filter(id => scores[id] !== null && scores[id] > 0);
  const max = candidates.length ? Math.max(...candidates.map(id => scores[id])) : null;
  const tied = candidates.filter(id => scores[id] === max);
  const code = tied[0] || 'P';
  const mode = candidates.length ? 'priority' : P === 0 ? 'support' : 'orientation';
  const meal = first ? 'первом приёме пищи' : 'завтраке';
  let title, description, action, observation, note = '';
  if (code === 'P') {
    title = first ? 'Немного больше внимания первому приёму пищи' : 'Немного больше внимания завтраку';
    observation = `P_${mode}_${first ? 'first_meal' : 'breakfast'}_${P}`;
    if (mode === 'support') {
      title = 'Сохраните привычку, которая уже есть';
      description = `По вашим ответам, белковые продукты уже регулярно бывают в ${meal}.`;
      action = `На ближайшей неделе продолжайте включать белковые продукты в ${first ? 'первый приём пищи за день' : 'завтрак'}. Понаблюдайте за сытостью после еды. Увеличивать порцию белка только из-за результата анкеты не нужно.`;
    } else if (mode === 'orientation') {
      title = 'Немного больше внимания первому приёму пищи';
      description = 'По ответам пока трудно уверенно выбрать, чему уделить внимание в первую очередь. Предлагаем начать с первого приёма пищи.';
      action = 'На ближайшей неделе обратите внимание, едите ли вы что-то белковое во время первого приёма пищи за день. Если обычно нет, попробуйте добавить белковый продукт к привычной еде. Понаблюдайте за сытостью и самочувствием после еды.';
    } else {
      description = `Судя по ответам, белковые продукты бывают в вашем ${meal} ${P === 2 ? 'нечасто' : 'не каждый день'}.`;
      action = first
        ? 'Попробуйте в течение ближайшей недели добавлять белковый продукт к первому приёму пищи за день. Заранее решите, какой продукт добавите к привычной еде. Понаблюдайте, как долго сохраняется сытость и когда хочется поесть снова.'
        : 'Попробуйте в течение ближайшей недели добавлять белковый продукт к привычному завтраку. С вечера решите, какой продукт добавите, чтобы утром было проще. Менять весь завтрак не нужно. Понаблюдайте, как вы чувствуете себя до обеда: надолго ли хватает сытости и когда хочется перекусить.';
    }
  } else if (code === 'V') {
    title = 'Больше растительной еды в привычном меню';
    observation = plants.find(x => x.score === V).id;
    const texts = {
      Q2:['Судя по ответам, овощей в вашем обычном дне пока немного.','Попробуйте на ближайшей неделе добавлять одну порцию овощей к привычному обеду. Выберите овощи, которые вам нравятся и которые удобно приготовить.'],
      Q3:['Судя по ответам, фрукты и ягоды появляются в вашем меню не каждый день.','Попробуйте на ближайшей неделе добавлять фрукт или порцию ягод к одному из привычных приёмов пищи.'],
      Q4:['Судя по ответам, в вашем меню часто повторяется один и тот же набор овощей, фруктов и зелени.','В ближайшую покупку включите один овощ, фрукт или вид зелени, которого давно не было в вашем меню. Попробуйте добавить выбранный продукт к знакомому блюду.']
    };
    [description, action] = texts[observation];
  } else {
    title = 'Вода под рукой';
    observation = score('Q6') > 0 ? 'Q6' : score('Q7') > 0 ? 'Q7' : 'Q5';
    description = {Q6:'Судя по ответам, за делами вы иногда забываете попить.',Q7:'Вы замечаете жажду, но не всегда получается сразу попить.',Q5:'По вашей оценке, в течение дня получается выпить немного напитков.'}[observation];
    action = 'Попробуйте на ближайшей неделе держать воду там, где проводите больше всего времени. Например, утром поставьте стакан или бутылку с водой на рабочий стол. Пусть вода будет под рукой, чтобы можно было попить, как только почувствуете жажду.';
    note = 'Если врач рекомендовал ограничивать жидкость, придерживайтесь его рекомендаций.';
  }
  return {questionnaire_version:QUESTIONNAIRE_VERSION,scoring_version:SCORING_VERSION,result_code:code,result_mode:mode,scores,tie_resolved:tied.length > 1,breakfast_context:first?'first_meal':'breakfast',observation_key:observation,title,description,action,note};
}

const root=document.getElementById('app');
document.getElementById('year').textContent=new Date().getFullYear();
const native=typeof google!=='undefined'&&!!google.script?.run;
let survey=SURVEY,answers={},step=0,result=null,busy=false,requestId=crypto.randomUUID(),bridgeReady=false,bridgeWindow=null,bridgeUnavailable=false;
const pending=new Map();
const bridgeChannel=crypto.randomUUID();
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const connected=()=>native||bridgeReady;
function rpc(method,payload){
  return new Promise((resolve,reject)=>{
    if(native){google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message)))[method](payload);return;}
    if(!bridgeReady){reject(new Error('Сервис подписки пока недоступен. Попробуйте позже.'));return;}
    const id=crypto.randomUUID();
    const timeout=setTimeout(()=>{pending.delete(id);reject(new Error('Сервис не ответил вовремя. Попробуйте ещё раз: повторная заявка не создаст второе письмо.'));},45000);
    pending.set(id,{resolve,reject,timeout});
    bridgeWindow.postMessage({type:'food-habits-request',channel:bridgeChannel,id,method,payload},bridgeOrigin);
  });
}
let bridgeOrigin='';
window.addEventListener('message',event=>{
  if(bridgeReady&&event.source!==bridgeWindow)return;
  const trusted=event.origin==='https://script.google.com'||/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(event.origin)||event.origin==='https://script.googleusercontent.com';
  if(!trusted)return;
  const message=event.data;
  if(message?.channel!==bridgeChannel)return;
  if(message?.type==='food-habits-ready'){
    bridgeOrigin=event.origin;bridgeWindow=event.source;bridgeReady=true;
    const status=document.getElementById('connection');if(status)status.textContent='';
    const button=document.getElementById('subscribe');if(button)button.disabled=false;
    rpc('getSurvey').then(value=>{if(step===0&&!Object.keys(answers).length)survey=value;}).catch(()=>{});
  }
  if(message?.type!=='food-habits-response')return;
  const request=pending.get(message.id);if(!request)return;
  clearTimeout(request.timeout);pending.delete(message.id);
  if(message.error)request.reject(new Error(message.error));else request.resolve(message.value);
});
function connect(){
  if(native){rpc('getSurvey').then(value=>survey=value).catch(()=>{});return;}
  if(!APP_CONFIG.backendUrl)return;
  const frame=document.createElement('iframe');frame.hidden=true;frame.title='Сервис подписки';frame.src=APP_CONFIG.backendUrl+'?bridge=1&channel='+bridgeChannel;document.body.append(frame);
  setTimeout(()=>{if(!bridgeReady){bridgeUnavailable=true;const status=document.getElementById('connection');if(status)status.textContent='Сервис подписки сейчас недоступен. Попробуйте позже.';}},15000);
}
function focusPage(){root.focus();window.scrollTo({top:0,behavior:'instant'});}
function intro(){
 root.innerHTML=`<section class="intro"><div class="intro-copy"><div class="eyebrow">Пищевые привычки · Елена Вилиткевич</div><h1>С какой<br><em>привычки</em><br>начать?</h1><p>Несколько коротких вопросов помогут присмотреться к вашему питанию и выбрать один небольшой шаг на ближайшую неделю.</p><p>Вспомните последние 7 дней и выбирайте то, что ближе к вашей обычной жизни. Здесь нет правильных или неправильных ответов.</p><div class="intro-actions"><button class="button" id="start">Начать анкету</button><a class="button secondary" href="#subscribe">Подписаться на письма Елены</a></div><div class="facts"><span>7–8 вопросов</span><span>2–3 минуты</span><span>Без регистрации</span></div></div><div class="art" role="img" aria-label="Иллюстрация тарелки с овощами и крупой"><div class="plate"><div class="food leaf"></div><div class="food tomato"></div><div class="food grain"></div></div><div class="art-label top">Без строгих правил</div><div class="art-label">Один небольшой шаг</div><div class="art-caption">Больше внимания к себе</div></div></section><p class="disclaimer">Анкета для взрослых помогает выбрать привычку и не заменяет индивидуальную оценку питания.</p>`;
 document.getElementById('start').onclick=()=>{step=0;question();focusPage();};
}
function question(){
 const list=activeQuestions(answers,survey),q=list[step],selected=answers[q.id];
 root.innerHTML=`<div class="survey-layout"><aside class="sidebar"><div class="eyebrow">Ваши привычки</div><h2>Здесь можно<br>быть собой.</h2><p>Вспомните последние 7 дней. Ничего взвешивать и считать до грамма не нужно.</p><div class="side-leaf" aria-hidden="true">❧</div><p>Вы можете вернуться назад и изменить ответ.</p></aside><section class="question-box"><div class="progress-meta"><span id="progress-label">Вопрос ${step+1} из ${list.length}</span><span id="progress-percent">${Math.round((step+1)/list.length*100)}%</span></div><div class="progress" role="progressbar" aria-label="Прогресс анкеты" aria-valuenow="${step+1}" aria-valuemin="0" aria-valuemax="${list.length}"><span style="width:${(step+1)/list.length*100}%"></span></div><h1 id="question-title">${escapeHtml(q.title)}</h1><p class="hint" id="hint">${escapeHtml(q.hint)}</p><form id="question-form"><fieldset aria-labelledby="question-title" aria-describedby="hint">${q.options.map(o=>`<label class="option"><input type="radio" name="answer" value="${o.id}" ${selected===o.id?'checked':''}><span>${escapeHtml(o.label)}</span></label>`).join('')}</fieldset><div class="error" id="error" role="alert"></div><div class="nav"><button class="text-button" type="button" id="back">${step?'Назад':'На главную'}</button><button class="button" type="submit" id="next" ${selected?'':'disabled'}>${step===list.length-1?'Посмотреть рекомендацию':'Далее'}</button></div></form></section></div>`;
 const form=document.getElementById('question-form');
 form.onchange=event=>{
   answers[q.id]=event.target.value;
   if(q.id==='Q1'&&event.target.value!=='NO_BREAKFAST')delete answers.Q1A;
   document.getElementById('next').disabled=false;
   const count=activeQuestions(answers,survey).length,percent=Math.round((step+1)/count*100);
   document.getElementById('progress-label').textContent=`Вопрос ${step+1} из ${count}`;
   document.getElementById('progress-percent').textContent=percent+'%';
   const bar=root.querySelector('[role="progressbar"]');bar.setAttribute('aria-valuemax',count);bar.firstElementChild.style.width=percent+'%';
 };
 document.getElementById('back').onclick=()=>{if(step>0){step--;question();}else intro();focusPage();};
 form.onsubmit=event=>{
   event.preventDefault();if(!answers[q.id])return;
   if(step<activeQuestions(answers,survey).length-1){step++;question();focusPage();return;}
   try{result=evaluate(answers);resultPage();focusPage();}catch(error){document.getElementById('error').textContent=error.message;}
 };
}
function resultPage(){
 root.innerHTML=`<div class="result-wrap"><section class="result-top"><div class="result-badge" aria-hidden="true">✓</div><div class="eyebrow" style="justify-content:center">С этого можно начать</div><h1>${escapeHtml(result.title)}</h1><p>${escapeHtml(result.description)}</p></section><section class="result-card"><h2>Ваш шаг на ближайшую неделю</h2><p>${escapeHtml(result.action)}</p>${result.note?`<p class="hint">${escapeHtml(result.note)}</p>`:''}</section>${subscriptionCard()}<p class="disclaimer">Анкета помогает выбрать привычку и не заменяет индивидуальную оценку питания. Результат доступен без подписки.</p><button class="text-button restart" id="restart">Пройти ещё раз</button></div>`;

 document.getElementById('restart').onclick=()=>{if(busy)return;answers={};result=null;requestId=crypto.randomUUID();intro();focusPage();};
 bindSubscription('quiz');
}
function subscriptionCard(standalone=false){
 return `<section class="email-card"><${standalone?'h1':'h2'}>Хотите получать письма от Елены?</${standalone?'h1':'h2'}><p>Оставьте имя и email — Елена Вилиткевич будет делиться советами по питанию и новостями. Отписаться можно в любой момент.</p><form id="email-form"><label class="email-label" for="name">Ваше имя</label><input class="contact-input" id="name" name="name" maxlength="80" autocomplete="given-name" required><label class="email-label" for="email">Ваш email</label><input class="contact-input" id="email" name="email" type="email" maxlength="254" placeholder="you@example.com" autocomplete="email" required><label class="consent"><input id="consent" type="checkbox" required><span>${escapeHtml(CONSENT_TEXT)}</span></label><details class="privacy"><summary>Как используются данные</summary><p>${standalone?'При запросе подписки имя, email и ваше согласие сохраняются':'При запросе подписки имя, email, ответы анкеты, результат и ваше согласие сохраняются'} в закрытой Google-таблице проекта Елены Вилиткевич. Адрес используется для подтверждения подписки и, после подтверждения, для писем Елены. Ответы без заявки остаются только в памяти этой страницы. Ссылка для отмены заявки и отписки есть в письме подтверждения.</p></details>${APP_CONFIG.privacyUrl?`<p><a href="${escapeHtml(APP_CONFIG.privacyUrl)}" target="_blank" rel="noopener">Политика конфиденциальности</a></p>`:''}<p id="connection" role="status">${connected()?'':bridgeUnavailable?'Сервис подписки сейчас недоступен. Попробуйте позже.':'Подключаем сервис подписки…'}</p><button class="button" type="submit" id="subscribe" ${connected()?'':'disabled'}>Подписаться</button><div id="email-status" role="status" aria-live="polite"></div></form></section>`;
}
function subscriptionPage(){
 root.innerHTML=`<div class="result-wrap standalone-subscription"><p class="eyebrow">Письма Елены Вилиткевич</p><p>Можно подписаться без прохождения анкеты.</p>${subscriptionCard(true)}<a class="text-button restart" href="#">На главную</a></div>`;
 bindSubscription('newsletter');
}
function bindSubscription(source){
 if(!native&&!APP_CONFIG.backendUrl)document.getElementById('connection').textContent='Подписка пока не подключена. Попробуйте позже.';
 document.getElementById('email-form').onsubmit=async event=>{
   event.preventDefault();if(busy)return;
   const form=event.currentTarget,status=document.getElementById('email-status'),button=document.getElementById('subscribe');
   const name=document.getElementById('name').value.trim();if(!name){document.getElementById('name').setCustomValidity('Введите имя.');document.getElementById('name').reportValidity();return;}
   busy=true;button.disabled=true;button.textContent='Сохраняем…';status.textContent='';
   try{
     const response=await rpc('requestSubscription',{id:requestId,version:QUESTIONNAIRE_VERSION,source,...(source==='quiz'?{answers}:{}),name,email:document.getElementById('email').value,consent:document.getElementById('consent').checked,consent_version:CONSENT_VERSION});
     const messages={confirmation_sent:'Проверьте почту: мы отправили письмо для подтверждения подписки.',saved_pending:'Имя и email сохранены. Отправку письма подтверждения пока не удалось подтвердить. Если письмо придёт, перейдите по ссылке; до подтверждения адрес не включается в рассылку.',already_exists:'Этот email уже есть в списке. Повторная заявка не добавлена.',already_confirmed:'Вы уже подписаны на письма Елены. Спасибо!'};
     if(!messages[response.status])throw new Error('Не удалось подтвердить сохранение. Попробуйте ещё раз.');
     form.innerHTML=`<p class="success" role="status">${messages[response.status]}</p>`;
   }catch(error){status.className='error';status.textContent=error.message;button.disabled=false;button.textContent='Попробовать ещё раз';}
   finally{busy=false;}
 };
 // Native validation bubbles otherwise follow the browser's language, not lang=ru.
 const subscriptionForm=document.getElementById('email-form');
 function localizeValidation(input){
   input.setCustomValidity('');
   let message='';
   if(input.id==='consent'&&!input.checked)message='Чтобы подписаться, подтвердите согласие на получение писем.';
   else if(input.id==='name'){
     if(!input.value.trim())message='Введите ваше имя.';
     else if(Array.from(input.value.trim()).length>80)message='Имя должно содержать не больше 80 символов.';
   }else if(input.id==='email'){
     if(!input.value.trim())message='Введите ваш email.';
     else if(input.validity.typeMismatch||! /^[^\s@<>]+@[^\s@<>.]+(?:\.[^\s@<>.]+)+$/.test(input.value.trim()))message='Введите корректный email, например name@example.com.';
     else if(input.value.trim().length>254)message='Email должен содержать не больше 254 символов.';
   }
   input.setCustomValidity(message);
 }
 subscriptionForm.querySelectorAll('input').forEach(input=>{
   localizeValidation(input);
   input.addEventListener('input',()=>localizeValidation(input));
   input.addEventListener('change',()=>localizeValidation(input));
   input.addEventListener('invalid',()=>localizeValidation(input));
 });
}
function route(){
 if(location.hash==='#subscribe'){requestId=crypto.randomUUID();subscriptionPage();}else intro();
 focusPage();
}
window.addEventListener('hashchange',route);
route();connect();
